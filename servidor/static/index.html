<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditorio Plata - Boletos</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f1f3f6; color: #222; }
  header { background: #1f2a44; color: #fff; padding: 24px; text-align: center; }
  header h1 { margin: 0 0 4px; }
  main { max-width: 560px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px;
          box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h2 { margin-top: 0; font-size: 1.1rem; }
  .barra { height: 14px; background: #e3e6ec; border-radius: 7px; overflow: hidden; margin: 10px 0; }
  .barra div { height: 100%; width: 0; background: #2e7d32; transition: width .4s; }
  button { background: #c9a227; color: #1f2a44; border: 0; padding: 12px 20px;
           border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; width: 140px; font-size: 1rem; }
  #resultado, #validacion { margin-top: 12px; }
  .ok { color: #2e7d32; font-weight: 600; }
  .mal { color: #c62828; font-weight: 600; }
  a.pdf { display: inline-block; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Auditorio Plata</h1>
  <div>Concierto Navideño · Boletos gratuitos</div>
</header>
<main>
  <section class="card">
    <h2>Disponibilidad</h2>
    <div id="estado">Cargando...</div>
    <div class="barra"><div id="progreso"></div></div>
  </section>

  <section class="card">
    <h2>Obtén tu boleto</h2>
    <button id="btnBoleto">Solicitar boleto</button>
    <div id="resultado"></div>
  </section>

  <section class="card">
    <h2>Validar boleto</h2>
    <input id="folioVal" type="number" placeholder="Folio">
    <button id="btnValidar">Validar</button>
    <div id="validacion"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

async function actualizarEstado() {
  try {
    const d = await (await fetch("/estado")).json();
    $("estado").textContent =
      `Emitidos: ${d.emitidos.toLocaleString()} de ${d.aforo.toLocaleString()} · Restantes: ${d.restantes.toLocaleString()}`;
    $("progreso").style.width = (d.emitidos / d.aforo * 100) + "%";
  } catch { $("estado").textContent = "No se pudo consultar el estado."; }
}

$("btnBoleto").onclick = async () => {
  const btn = $("btnBoleto"), out = $("resultado");
  btn.disabled = true; out.textContent = "Generando boleto...";
  try {
    const r = await fetch("/boleto", { method: "POST" });
    const d = await r.json();
    if (r.ok) {
      out.innerHTML = `<div class="ok">¡Listo! Tu folio es ${String(d.folio).padStart(6, "0")}</div>
                       <a class="pdf" href="${d.pdf}">Descargar boleto en PDF</a>`;
    } else {
      out.innerHTML = `<div class="mal">${d.detail || "No se pudo emitir el boleto"}</div>`;
    }
  } catch { out.innerHTML = `<div class="mal">Error de red. Intenta de nuevo.</div>`; }
  btn.disabled = false;
  actualizarEstado();
};

$("btnValidar").onclick = async () => {
  const folio = $("folioVal").value;
  if (!folio) return;
  const d = await (await fetch("/validar/" + folio)).json();
  $("validacion").innerHTML = d.valido
    ? `<div class="ok">Boleto válido · emitido el ${d.fecha}</div>`
    : `<div class="mal">Boleto NO válido</div>`;
};

actualizarEstado();
setInterval(actualizarEstado, 3000);
</script>
</body>
</html>
